<div xmlns:th="http://www.thymeleaf.org" th:fragment="messages">
    <div th:if="${successMessage != null}" class="editorial-alert alert-success">
        <span th:text="${successMessage}">Operation successful.</span>
    </div>
    <div th:if="${errorMessage != null}" class="editorial-alert alert-error">
        <span th:text="${errorMessage}">An error occurred.</span>
    </div>
    <div th:if="${infoMessage != null}" class="editorial-alert alert-info">
        <span th:text="${infoMessage}">Notice.</span>
    </div>
</div>
